# ============================================================
#  Despliegue del Chatbot + PostgreSQL con Docker Compose
#  Uso:  docker compose up -d --build
# ============================================================
services:
  # Base de datos (memoria del bot)
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-chatbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # El chatbot
  chatbot:
    build: .
    container_name: chatbot-app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: .env
    environment:
      # Dentro de Docker, la BD se llama "postgres" (nombre del servicio).
      # Estas credenciales usan el MISMO valor que el contenedor postgres,
      # así siempre coinciden aunque falten en el .env.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-chatbot}
      PORT: "3000"
      # Persistir conocimiento y flujo en la carpeta montada ./data
      KNOWLEDGE_FILE: data/knowledge.md
      FLOW_FILE: data/flow.json
      CONV_STORE_FILE: data/conversations.json
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
