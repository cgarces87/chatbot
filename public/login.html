<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Panel del Chatbot</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    :root {
      --brand: #144086; --brand-dark: #0e2f63; --brand-accent: #1e5bb8;
      --card: #ffffff; --border: #e5e9f2; --text: #1f2937; --muted: #6b7280; --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); color: var(--text); padding: 20px;
    }
    .brand-logo { margin-bottom: 22px; text-align: center; }
    .brand-logo img { height: 38px; }
    .login {
      width: 100%; max-width: 380px; background: var(--card); border-radius: 16px;
      padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    h1 { font-size: 19px; text-align: center; margin: 0 0 4px; color: var(--brand); }
    .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #374151; margin: 16px 0 6px; font-weight: 500; }
    input {
      width: 100%; background: #f9fafb; border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(30,91,184,.18); background: #fff; }
    button {
      width: 100%; margin-top: 24px; background: var(--brand); color: white; border: none;
      border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 16px; padding: 11px 14px; border-radius: 10px; font-size: 14px; display: none; text-align: center; }
    .msg.err { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; display: block; }
    .foot { text-align: center; margin-top: 22px; font-size: 12px; color: #9ca3af; }
    @media (max-width: 420px) { .login { padding: 26px 20px; } }
  </style>
</head>
<body>
  <div class="brand-logo"><img src="/logo.png" alt="Pronetsys" /></div>

  <form class="login" id="form">
    <h1>Panel del Chatbot</h1>
    <div class="sub">Inicia sesión para administrar</div>

    <label for="user">Usuario</label>
    <input id="user" name="user" type="text" autocomplete="username" autofocus required />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="btn">Ingresar</button>
    <div class="msg" id="msg"></div>
    <div class="foot">WhatsApp + OpenAI · Pronetsys</div>
  </form>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Ingresando…'; msg.style.display = 'none';
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: form.user.value, password: form.password.value }),
        });
        if (r.ok) { window.location.href = '/admin'; return; }
        const d = await r.json().catch(() => ({}));
        msg.className = 'msg err'; msg.textContent = '❌ ' + (d.error || 'No se pudo iniciar sesión');
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = '❌ ' + err.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
